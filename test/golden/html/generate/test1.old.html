<!-- [ATTR] значение атрибута с $i18n{…} меняется в одном из двух похожих тегов -->
<settings-section page-title="$i18n{privacyPageTitle}" section="privacy">
  <settings-toggle-button id="safeBrowsing" pref="{{prefs.safebrowsing.enabled}}"
      label="$i18n{safeBrowsingLabel}" sub-label="$i18n{safeBrowsingDesc}">
  </settings-toggle-button>
  <settings-toggle-button id="doNotTrack" pref="{{prefs.enable_do_not_track}}"
      label="$i18n{doNotTrackLabel}" sub-label="$i18n{doNotTrackDesc}">
  </settings-toggle-button>
</settings-section>
